<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSC Position Visualiser</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="view"></div>

  <header id="status">
    <span id="conn" class="pill bad">disconnected</span>
    <span class="inputs" role="group" aria-label="Inputs">
      <button id="input-osc" class="input" data-kind="osc" aria-pressed="true">OSC</button>
      <button id="input-psn" class="input" data-kind="psn" aria-pressed="true">PSN</button>
    </span>
    <span id="summary"></span>
    <span class="spacer"></span>
    <button id="resetView" title="Reset camera">Reset view</button>
    <button id="topView" title="Top-down plan view">Top</button>
    <button id="toggleTrails">Trails: on</button>
    <button id="toggleFloor" title="Set the floor size and line it up with the real stage">Floor</button>
    <button id="toggleTable" title="Exact live values for every tracker">Table</button>
    <button id="toggleMonitor">OSC monitor</button>
  </header>

  <aside id="floorPanel" hidden>
    <div class="floor-head">
      <strong>Floor</strong>
    </div>
    <div class="floor-fields">
      <label>Width <input id="floorW" type="number" step="0.01" min="0.1"> m</label>
      <label>Depth <input id="floorD" type="number" step="0.01" min="0.1"> m</label>
    </div>
    <div class="floor-fields">
      <label>X <input id="floorX" type="number" step="0.01"> m</label>
      <label>Y <input id="floorY" type="number" step="0.01"> m</label>
      <label>Rotate <input id="floorRot" type="number" step="0.5"> °</label>
    </div>
    <p class="hint">Drag the floor. Arrow keys nudge 1 cm (Shift: 10 cm). <kbd>[</kbd> <kbd>]</kbd> rotate 1° (Shift: 15°).</p>
    <div class="floor-actions">
      <span id="floorState"></span>
      <span class="spacer"></span>
      <button id="floorRevert">Revert</button>
      <button id="floorSave" class="primary">Save</button>
    </div>
  </aside>

  <aside id="table" hidden>
    <div class="table-head">
      <strong>Live data</strong>
      <small>stage coordinates, metres</small>
      <span class="spacer"></span>
      <button id="freezeTable" title="Hold the values so you can read or copy them">Freeze</button>
      <button id="clearTable" title="Forget trackers that are no longer sending">Clear</button>
    </div>
    <div class="table-scroll">
      <table id="liveTable">
        <colgroup>
          <col class="c-swatch"><col class="c-name"><col class="c-src"><col class="c-addr"><col class="c-from">
          <col class="c-xyz"><col class="c-xyz"><col class="c-xyz"><col class="c-hz"><col class="c-age">
        </colgroup>
        <thead><tr>
          <th></th><th>Tracker</th><th>Input</th><th>Address</th><th>From</th>
          <th class="num">X</th><th class="num">Y</th><th class="num">Z</th><th class="num">Hz</th><th class="num">Age</th>
        </tr></thead>
        <tbody><tr class="empty"><td colspan="10">No trackers yet</td></tr></tbody>
      </table>
    </div>
  </aside>

  <aside id="monitor" hidden>
    <div class="monitor-head">
      <strong>OSC monitor</strong>
      <span class="spacer"></span>
      <button id="pauseLog">Pause</button>
      <button id="clearLog">Clear</button>
    </div>
    <section>
      <h3>Senders</h3>
      <ul id="senders"></ul>
    </section>
    <section>
      <h3>Addresses <small>(red = no mapping in config.json)</small></h3>
      <table id="addresses"><thead><tr><th>Address</th><th>Hz</th><th>Last args</th></tr></thead><tbody></tbody></table>
    </section>
    <section class="grow">
      <h3>Log</h3>
      <pre id="log"></pre>
    </section>
  </aside>

  <script type="module" src="main.js"></script>
</body>
</html>
